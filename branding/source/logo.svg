      <stop offset="0" stop-color="#14808F"/>
      <stop offset="1" stop-color="#0A3A47"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE3D6"/>
